# Roda em todo push e pull request: testes, build, conferência do Worker e
# auditoria de dependências. Não publica nada: o deploy é manual (npm run publicar).
# As actions são fixadas pelo hash do commit (não pela tag), para que ninguém
# consiga trocar o código delas por baixo (ataque à cadeia de suprimentos).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências (exatamente as do package-lock)
        run: npm ci --ignore-scripts

      - name: Testes
        run: npm test

      - name: Build do site e conferência do Worker (sem publicar)
        run: npm run conferir:worker
        env:
          WRANGLER_SEND_METRICS: 'false'

      - name: Auditoria de dependências
        run: npm audit --audit-level=high
